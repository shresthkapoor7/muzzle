name: Release DMG

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }} DMG
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            architecture: arm64
            runner: macos-latest
          - name: Intel
            architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DMG packaging dependency
        run: python3 -m pip install -r scripts/requirements-dmg.txt

      - name: Build app
        env:
          MUZZLE_ARCH: ${{ matrix.architecture }}
        run: scripts/build-app.sh

      - name: Package DMG
        env:
          MUZZLE_ARCH: ${{ matrix.architecture }}
          MUZZLE_VERSION: ${{ github.ref_name }}
        run: scripts/package-dmg.sh

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: Muzzle-${{ matrix.architecture }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/*.dmg --generate-notes
