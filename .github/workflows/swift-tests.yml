name: Swift tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Swift tests
        run: swift test
      - name: Build and verify packaged app
        run: |
          scripts/build-app.sh
          codesign --verify --deep --strict dist/Muzzle.app
      - name: Validate root-owned staging with disposable fixtures
        run: sudo env DEVELOPER_DIR="$DEVELOPER_DIR" MUZZLE_TEST_APP="$GITHUB_WORKSPACE/dist/Muzzle.app" /usr/bin/swift test --skip-build --filter StagingTests
